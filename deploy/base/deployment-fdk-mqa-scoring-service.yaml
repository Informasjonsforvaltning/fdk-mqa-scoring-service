apiVersion: apps/v1
kind: Deployment
metadata:
  name: fdk-mqa-scoring-service
  labels:
    app: fdk-mqa-scoring-service
    fdk.service: fdk-mqa-scoring-service
spec:
  replicas: 1
  selector:
    matchLabels:
      fdk.service: fdk-mqa-scoring-service
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: fdk-mqa-scoring-service
        fdk.service: fdk-mqa-scoring-service
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: fdk-mqa-scoring-service
          image: fdk-mqa-scoring-service
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: NAMESPACE
              valueFrom:
                secretKeyRef:
                  name: common
                  key: NAMESPACE
            - name: SCHEMA_REGISTRY
              valueFrom:
                secretKeyRef:
                  name: fdk-metadata-quality
                  key: SCHEMA_REGISTRY
            - name: BROKERS
              valueFrom:
                secretKeyRef:
                  name: kafka-user-fdk-mqa-scoring-service
                  key: BROKERS
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                secretKeyRef:
                  name: kafka-user-fdk-mqa-scoring-service
                  key: SECURITY_PROTOCOL
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                secretKeyRef:
                  name: kafka-user-fdk-mqa-scoring-service
                  key: SASL_MECHANISM
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-user-fdk-mqa-scoring-service
                  key: USERNAME
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-user-fdk-mqa-scoring-service
                  key: PASSWORD
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: fdk-metadata-quality
                  key: API_KEY
            - name: SCORING_API_URL
              value: http://fdk-mqa-scoring-api:8082
          resources:
            requests:
              memory: "2Gi"
              cpu: "300m"
            limits:
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
