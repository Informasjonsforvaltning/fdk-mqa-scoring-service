[package]
name = "fdk-mqa-scoring-service"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.14.0"
apache-avro = "0.21.0"
chrono = "0.4.45"
futures = "0.3.33"
httptest = "0.16.4"
lazy_static = "1.5.0"
mimalloc = "0.1.52"
oxigraph = "0.5.9"
prometheus = "0.14.0"
rdkafka = "0.39.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json"] }
schema_registry_converter = { version = "4.10.0", features = ["avro", "blocking"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter", "tracing-log"] }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
sophia_api = "0.10.0"
sophia_isomorphism = "0.10.0"
sophia_turtle = "0.10.0"
